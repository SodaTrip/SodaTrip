<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Yasser Mendoza Cloud Engineering Journey</title>
  <desc id="desc">Animated segmented learning-stage bars using a dark syntax-inspired palette.</desc>
  <defs><style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.title{fill:#f8fafc;font-size:21px;font-weight:700}.subtitle{fill:#94a3b8;font-size:14px}.label{fill:#f8fafc;font-size:17px;font-weight:600}.status{fill:#94a3b8;font-size:13px}.track{fill:#1b2432}.b1{fill:#46654f}.b2{fill:#5b7c5b}.b3{fill:#6f9a68}.b4{fill:#83b86f}.key{fill:#c792ea}.value{fill:#7ee787}.active{animation:reveal 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}.d1{animation-delay:.08s}.d2{animation-delay:.20s}.d3{animation-delay:.32s}.d4{animation-delay:.44s}@keyframes reveal{0%,8%{opacity:.18;transform:scaleX(.18)}28%,82%{opacity:1;transform:scaleX(1)}100%{opacity:.92;transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.active{animation:none!important;opacity:1;transform:none}}
  </style></defs>
