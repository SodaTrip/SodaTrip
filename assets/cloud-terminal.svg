<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">Yasser Mendoza Cloud Engineering Terminal</title>
  <desc id="desc">Animated terminal introducing Yasser Mendoza as a cloud engineer in progress focused on Google Cloud, Linux, automation, security, and observability.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #60a5fa; font-weight: 700; }
      .primary { fill: #e5e7eb; }
      .muted { fill: #94a3b8; }
      .success { fill: #86efac; }
      .cursor { fill: #e5e7eb; animation: blink 1s steps(1,end) infinite; }
      .line1 { animation: show1 8s infinite; }
      .line2 { animation: show2 8s infinite; }
      .line3 { animation: show3 8s infinite; }
      .line4 { animation: show4 8s infinite; }
      .line5 { animation: show5 8s infinite; }
      @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
      @keyframes show1 { 0%,8% { opacity:0 } 10%,100% { opacity:1 } }
      @keyframes show2 { 0%,24% { opacity:0 } 26%,100% { opacity:1 } }
      @keyframes show3 { 0%,40% { opacity:0 } 42%,100% { opacity:1 } }
      @keyframes show4 { 0%,56% { opacity:0 } 58%,100% { opacity:1 } }
      @keyframes show5 { 0%,72% { opacity:0 } 74%,100% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .line1,.line2,.line3,.line4,.line5,.cursor { animation: none !important; opacity:1; }
      }
    </style>
  </defs>

  <rect x="25" y="20" width="950" height="250" rx="18" fill="#0b1220"/>
  <rect x="25" y="20" width="950" height="42" rx="18" fill="#111827"/>
  <rect x="25" y="47" width="950" height="15" fill="#111827"/>

  <circle cx="55" cy="41" r="6" fill="#f87171"/>
  <circle cx="77" cy="41" r="6" fill="#fbbf24"/>
  <circle cx="99" cy="41" r="6" fill="#4ade80"/>
  <text x="500" y="47" text-anchor="middle" class="mono muted" font-size="14">cloud-engineering — yasser@sodatrip</text>

  <g class="mono" font-size="20">
    <text x="62" y="102" class="line1"><tspan class="prompt">$</tspan><tspan class="primary"> whoami</tspan></text>
    <text x="62" y="136" class="line2"><tspan class="success">Yasser Mendoza</tspan><tspan class="muted"> — Cloud Engineer in Progress</tspan></text>
    <text x="62" y="170" class="line3"><tspan class="prompt">$</tspan><tspan class="primary"> focus --cloud=gcp --systems=linux --mindset=automation</tspan></text>
    <text x="62" y="204" class="line4"><tspan class="muted">security ✓   observability ✓   ci/cd ✓   documentation ✓</tspan></text>
    <text x="62" y="238" class="line5"><tspan class="prompt">$</tspan><tspan class="primary"> next</tspan><tspan class="muted"> → terraform → kubernetes → sre</tspan><tspan class="cursor"> █</tspan></text>
  </g>
</svg>
