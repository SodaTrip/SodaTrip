<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">Yasser Mendoza Cloud Engineering Terminal</title>
  <desc id="desc">Terminal style profile card using a dark syntax-inspired palette.</desc>
  <defs><style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.key{fill:#c792ea}.value{fill:#7ee787}.text{fill:#f8fafc}.muted{fill:#94a3b8}.accent{fill:#8be9fd}.cursor{fill:#f8fafc;animation:blink 1s steps(1,end) infinite}.l1{animation:s1 9s infinite}.l2{animation:s2 9s infinite}.l3{animation:s3 9s infinite}.l4{animation:s4 9s infinite}.l5{animation:s5 9s infinite}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes s1{0%,8%{opacity:0}10%,100%{opacity:1}}@keyframes s2{0%,22%{opacity:0}24%,100%{opacity:1}}@keyframes s3{0%,38%{opacity:0}40%,100%{opacity:1}}@keyframes s4{0%,54%{opacity:0}56%,100%{opacity:1}}@keyframes s5{0%,70%{opacity:0}72%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){.l1,.l2,.l3,.l4,.l5,.cursor{animation:none!important;opacity:1}}
  </style></defs>
  <rect x="25" y="20" width="950" height="250" rx="18" fill="#0b1220" stroke="#273244"/><rect x="25" y="20" width="950" height="42" rx="18" fill="#111827"/><rect x="25" y="47" width="950" height="15" fill="#111827"/>
  <circle cx="55" cy="41" r="6" fill="#f87171"/><circle cx="77" cy="41" r="6" fill="#fbbf24"/><circle cx="99" cy="41" r="6" fill="#4ade80"/><text x="500" y="47" text-anchor="middle" class="mono muted" font-size="14">profile.py — yasser@sodatrip</text>
  <g class="mono" font-size="22">
    <text x="60" y="98" class="l1"><tspan class="key">name</tspan><tspan class="text"> = </tspan><tspan class="value">"Yasser Mendoza"</tspan></text>
    <text x="60" y="132" class="l2"><tspan class="key">role</tspan><tspan class="text"> = </tspan><tspan class="value">"Cloud Engineer in Progress"</tspan></text>
    <text x="60" y="166" class="l3"><tspan class="key">focus</tspan><tspan class="text"> = [</tspan><tspan class="value">"Google Cloud"</tspan><tspan class="text">, </tspan><tspan class="value">"Linux"</tspan><tspan class="text">, </tspan><tspan class="value">"OpenAI"</tspan><tspan class="text">]</tspan></text>
    <text x="60" y="200" class="l4"><tspan class="key">building</tspan><tspan class="text"> = </tspan><tspan class="value">"secure, observable cloud systems"</tspan></text>
    <text x="60" y="234" class="l5"><tspan class="key">next</tspan><tspan class="text"> = </tspan><tspan class="accent">"terraform → kubernetes → sre"</tspan><tspan class="cursor"> █</tspan></text>
